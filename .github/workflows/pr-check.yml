name: PR Checks

# 专门为 Pull Request 设计的快速检查
on:
  pull_request:
    types: [opened, synchronize, reopened]

# PR 更新时取消旧的运行，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # 快速检查 - 只验证变更部分
  quick-check:
    name: Quick Check (Affected Only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 只需要最近的历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # 快速检查格式化（最快的检查）
      - name: Check formatting
        run: turbo run format --affected

      # 类型检查
      - name: Type check
        run: turbo run typecheck --affected

      # 构建验证
      - name: Build check
        run: turbo run build --affected

  # 代码质量检查（可选，如果添加了 ESLint）
  lint-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    # 当前 lint 任务是 prettier check，如果将来添加 ESLint 可以启用
    if: false  # 暂时禁用，等添加真正的 lint 工具后再启用

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: turbo run lint --affected
