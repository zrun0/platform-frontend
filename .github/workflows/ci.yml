name: CI

# Trigger conditions: push to main branches and all Pull Requests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel outdated runs of the same PR to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main build and test job
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Get enough history for --affected detection

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      # 3. Setup Node.js with automatic node_modules caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 4. Install dependencies (fast if cache hits)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Cache Turbo build outputs
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json') }}-
            ${{ runner.os }}-turbo-

      # 6. Run ESLint checks
      - name: Lint check
        run: pnpm turbo run lint --affected

      # 7. Check code formatting
      - name: Format check
        run: pnpm turbo run format --affected

      # 8. Run type checks
      - name: Type check
        run: pnpm turbo run typecheck --affected

      # 9. Build affected packages
      - name: Build affected packages
        run: pnpm turbo run build --affected

      # 10. Run tests
      - name: Test affected packages
        run: pnpm turbo run test --affected

      # 11. Upload build artifacts (optional)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 7
          if-no-files-found: ignore

  # Full build validation (main branches only)
  full-build:
    name: Full Build Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/turbo.json') }}-
            ${{ runner.os }}-turbo-

      # Full build to verify all packages build correctly
      - name: Build all packages
        run: pnpm turbo run build

      - name: Test all packages
        run: pnpm turbo run test

      # Verify all tasks can run properly
      - name: Verify all tasks
        run: |
          echo "Verifying all turbo tasks..."
          pnpm turbo run build --dry=json | jq '.tasks | length'
          pnpm turbo run lint --dry=json | jq '.tasks | length'
          pnpm turbo run format --dry=json | jq '.tasks | length'
          pnpm turbo run typecheck --dry=json | jq '.tasks | length'
