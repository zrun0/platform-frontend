# Shared static SPA config for portal/uc/flow images.
# CORS is required in prod: the wujie host fetches sub-app HTML/JS/CSS
# cross-origin (mirrors the dev vite `Access-Control-Allow-*` setup).
# Cache policy lives in one map: add_header with an empty value is omitted,
# so server-level headers cover every location without repetition.
map $uri $cache_control {
  default '';
  /index.html 'no-cache';
  /config.js 'no-cache';
  ~^/assets/ 'public, max-age=31536000, immutable';
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header Access-Control-Allow-Origin * always;
  add_header Cache-Control $cache_control;

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
